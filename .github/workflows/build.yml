name: Build SpeakSel.zip

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Test and ad-hoc package
        run: |
          chmod +x scripts/build-zip.sh scripts/release.sh
          scripts/build-zip.sh

      - name: Upload unsigned zip (CI only)
        uses: actions/upload-artifact@v4
        with:
          name: SpeakSel-unsigned
          path: build/dist/SpeakSel.zip
          if-no-files-found: error

      - name: Remind that installable zips must be notarized
        if: ${{ secrets.DEVELOPER_ID_P12_BASE64 == '' }}
        run: |
          echo '::notice::Installable releases need Developer ID + notarization. Add the secrets in docs/releasing.md. Ad-hoc zips reset Gatekeeper and Accessibility.'

  notarize:
    needs: test
    if: ${{ github.event_name != 'pull_request' && secrets.DEVELOPER_ID_P12_BASE64 != '' }}
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Import Developer ID certificate
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          p12-password: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}

      - name: Write App Store Connect API key
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          printf '%s\n' "$APPLE_API_KEY" > "${RUNNER_TEMP}/AuthKey.p8"
          chmod 600 "${RUNNER_TEMP}/AuthKey.p8"

      - name: Notarize and staple
        env:
          APPLE_API_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          DEVELOPMENT_TEAM: MHCFHR9BB2
        run: |
          chmod +x scripts/release.sh
          SKIP_TESTS=1 scripts/release.sh

      - name: Upload notarized zip
        uses: actions/upload-artifact@v4
        with:
          name: SpeakSel
          path: build/dist/SpeakSel.zip
          if-no-files-found: error

      - name: Publish prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.2-pre
          name: SpeakSel 1.0.2-pre
          prerelease: true
          make_latest: false
          target_commitish: ${{ github.sha }}
          files: build/dist/SpeakSel.zip
          body: |
            Notarized Developer ID build of the Claude Code selection fix.

            Replacing 1.0.1 with this zip keeps the same signing identity, so Gatekeeper and Accessibility stay granted.

            1. Download **SpeakSel.zip**
            2. Unzip and replace `/Applications/SpeakSel.app`
            3. Open SpeakSel
            4. Highlight in Claude Code and press Control-Option-R
